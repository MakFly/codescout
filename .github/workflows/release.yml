name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
      # ripgrep is a hard runtime dependency; a green build without it would
      # prove nothing about whether scout actually works.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: gofmt -l . | tee /tmp/fmt && [ ! -s /tmp/fmt ]
      - run: go vet ./...
      - run: go test ./...
      - name: Smoke test against this repo
        run: |
          go build -o scout .
          ./scout doctor
          ./scout search extractBody . | tee /tmp/out
          grep -q '\[def\]' /tmp/out

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
      # Pure stdlib, so every target cross-compiles from one runner with CGO
      # off — no per-OS runner, no toolchain matrix.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o "scout-${{ matrix.goos }}-${{ matrix.goarch }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: scout-${{ matrix.goos }}-${{ matrix.goarch }}
          path: scout-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The tag may already carry a release created by hand, so upload into it
      # rather than failing on "already exists".
      - name: Publish release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" scout-* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" scout-* --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
