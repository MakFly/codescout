[package]
name = "codescout"
version = "0.1.0"
edition = "2021"
description = "Ranked, budgeted code search for LLM coding agents. Wraps ripgrep, never hides a definition. No index, no daemon."
license = "MIT"
repository = "https://github.com/MakFly/codescout"
homepage = "https://github.com/MakFly/codescout"
readme = "README.md"
keywords = ["code-search", "ripgrep", "llm", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

# The crate is `codescout`, the command is `scout` — short enough for an agent
# to type on every call.
[[bin]]
name = "scout"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"
